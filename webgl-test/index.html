<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL test</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  #scroll { height: 500vh; position: relative; }
  canvas { position: sticky; top: 0; display: block; width: 100%; height: 100vh; }
  .caption {
    position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%);
    font-size: clamp(1.5rem, 4vw, 3rem); font-weight: 600; text-align: center;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  .caption.on { opacity: 1; }
</style>
</head>
<body>
<div id="scroll"><canvas id="c"></canvas></div>
<div class="caption" id="t1">Scroll-driven WebGL</div>
<div class="caption" id="t2">Running on Vercel</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.z = 7;

const mesh = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1, 0.32, 200, 32),
  new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1, roughness: 0.18 })
);
scene.add(mesh);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let target = 0, current = 0;
const scroller = document.getElementById('scroll');
function readScroll() {
  target = Math.min(1, Math.max(0, scrollY / (scroller.offsetHeight - innerHeight)));
}
addEventListener('scroll', readScroll);
readScroll();

const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');

renderer.setAnimationLoop(() => {
  current += (target - current) * 0.08; // smoothing
  mesh.rotation.y = current * Math.PI * 4;
  mesh.rotation.x = current * Math.PI;
  mesh.position.x = Math.sin(current * Math.PI) * 1.5;
  camera.position.z = 7 - current * 3;
  t1.classList.toggle('on', current > 0.15 && current < 0.45);
  t2.classList.toggle('on', current > 0.6 && current < 0.9);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
