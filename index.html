<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="trustpilot-one-time-domain-verification-id" content="26d6499e-dc13-4c6c-a0c5-cbfcbd5d644a"/>
    <title>charon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- the "world": background video, starts loading during the intro -->
    <video id="vidarea" loop playsinline preload="auto" muted></video>
    <div id="vignette"></div>

    <!-- intro: loading screen -->
    <section id="intro">
        <div class="loading">
            <p id="intro-text"></p>
            <div id="loadbar"><i id="loadfill"></i></div>
        </div>
        <p id="skip">Click to skip...</p>
    </section>

    <!-- main: title screen -->
    <main id="main" hidden>
        <div id="title">
            <h1 id="name">charon.gay</h1>
            <span id="splash"></span>
        </div>
        <nav class="menu">
            <a class="mcbtn" href="https://steamcommunity.com/id/charongod/" target="_blank" rel="noopener">Steam</a>
            <button class="mcbtn" type="button" id="discord">Discord</button>
            <a class="mcbtn" href="https://github.com/cchhaarroonn" target="_blank" rel="noopener">GitHub</a>
            <div class="menu-row">
                <button class="mcbtn" type="button" id="btn-music">Music: OFF</button>
                <button class="mcbtn" type="button" id="btn-tp">Teleport</button>
            </div>
        </nav>
    </main>

    <!-- minecraft-style HUD -->
    <canvas id="hand3d" hidden></canvas>
    <div id="hand" hidden><img id="held" alt=""></div>
    <div id="chat"></div>
    <div id="flash"></div>
    <div id="hud" hidden>
        <div id="nowplaying"></div>
        <div id="itemname"></div>
        <div class="stats">
            <div id="hearts"></div>
            <div id="food"></div>
        </div>
        <div id="xp"><i id="xpfill"></i><span id="level"></span></div>
        <div id="hotbar"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="assets/js/hud.js"></script>
    <script src="assets/js/index.js"></script>
</body>
</html>
