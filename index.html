[-.055, .055].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.017, 10, 8), mat(0x15101c)); e.position.set(x, .865, .138); hips.add(e); });
const legs = [], arms = [];
[-1, 1].forEach(s => {
  const th = new THREE.Group(), sh = new THREE.Group();
  const tm = caps(.092, .45, FLC); tm.position.y = -.225; th.add(tm);
  const sm = caps(.068, .45, FLC); sm.position.y = -.225; sh.add(sm);
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(.062, .062, .06, 14), FLD); cuff.position.y = -.4; sh.add(cuff);
  sh.add(box(.15, .09, .29, SHOE, 0, -.465, .06, .04), box(.152, .03, .295, SOLE, 0, -.505, .06, .012));
  th.position.set(s * .115, 0, 0); sh.position.y = -.45; th.add(sh); hips.add(th); legs.push({ th, sh, s });
  const up = new THREE.Group(), fo = new THREE.Group();
  const um = caps(.065, .3, FLC); um.position.y = -.15; up.add(um);
  const fm = caps(.056, .3, FLC); fm.position.y = -.15; fo.add(fm);
  const hand = new THREE.Mesh(new THREE.SphereGeometry(.05, 14, 10), SKIN); hand.position.y = -.33; fo.add(hand);
  const ac = new THREE.Mesh(new THREE.CylinderGeometry(.052, .052, .04, 12), FLD); ac.position.y = -.28; fo.add(ac);
  up.position.set(s * .285, .53, 0); fo.position.y = -.3; up.add(fo); hips.add(up); arms.push({ up, fo, s });
});
function pose(p) {
  const turn = S(.35, .43, p), step = S(.43, .5, p), sit = S(.5, .6, p), walk = 1 - sit, ph = p * 85;
  char.position.set(L(-3.2, 0, S(0, .35, p)), 0, 1.9 - .65 * step - .25 * sit);
  char.rotation.y = L(Math.PI / 2, Math.PI, turn);
  hips.position.y = .955 - .4 * sit + Math.abs(Math.cos(ph)) * .03 * walk;
  legs.forEach(({ th, sh, s }) => { const a = Math.sin(ph + (s > 0 ? 0 : Math.PI));
    th.rotation.x = a * .6 * walk - sit * 1.5708; sh.rotation.x = Math.max(0, -a) * .9 * walk + sit * 1.5708; });
  arms.forEach(({ up, fo, s }) => { const a = Math.sin(ph + (s > 0 ? Math.PI : 0));
    up.rotation.x = a * .6 * walk - sit * 1.0; fo.rotation.x = -sit * .75; });
  head.rotation.x = hair.rotation.x = 0;
}

// ---------- camera path ----------
const K = [
  [0,   [-1.2, 1.6, 5.6],  [-2.6, 1, 1.8]],
  [.4,  [2.6, 1.7, 4.3],   [-.2, 1, 1.6]],
  [.6,  [1.6, 1.55, 2.7],  [0, 1.1, .7]],
  [.8,  [-.5, 1.45, 1.35], [-.45, 1.15, -.1]],
  [.92, [-.44, 1.15, .62], [-.56, 1.15, -.2]],
  [1,   [-.5, 1.15, .36],  [-.56, 1.15, -.2]],
];
const look = new THREE.Vector3();
function placeCamera(p) {
  let i = 0; while (i < K.length - 2 && p > K[i + 1][0]) i++;
  const a = K[i], b = K[i + 1], t = Math.min(1, Math.max(0, (p - a[0]) / (b[0] - a[0])));
  camera.position.set(L(a[1][0], b[1][0], t), L(a[1][1], b[1][1], t), L(a[1][2], b[1][2], t));
  look.set(L(a[2][0], b[2][0], t), L(a[2][1], b[2][1], t), L(a[2][2], b[2][2], t)); camera.lookAt(look);
}

// ---------- scroll + loop ----------
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); if (composer) composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 55 : 35; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const scroller = document.getElementById('scroll'), end = document.getElementById('end'), hint = document.getElementById('hint');
let target = 0, cur = 0;
const read = () => { target = Math.min(1, Math.max(0, scrollY / (scroller.offsetHeight - innerHeight))); };
addEventListener('scroll', read); read();
document.getElementById('skip').onclick = () => scrollTo({ top: scroller.offsetHeight, behavior: 'smooth' });

renderer.setAnimationLoop(t => {
  cur += (target - cur) * .07;
  if (cur > .4) drawMain(t / 1000, cur);
  pose(cur); placeCamera(cur);
  const o = S(.9, .99, cur);
  end.style.opacity = o; end.classList.toggle('live', o > .9);
  hint.style.opacity = cur < .02 ? .7 : 0;
  composer ? composer.render() : renderer.render(scene, camera);
});
</script>
